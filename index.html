<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SENSEI ERP X</title>

<link rel="stylesheet" href="./css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            <h1>SENSEI</h1>
            <span>ERP X ENTERPRISE</span>
        </div>

        <div class="menu">

            <button class="menu-btn active">
                🎱 ЗАЛ
            </button>

            <button class="menu-btn">
                🍹 BAR / POS
            </button>

            <button class="menu-btn">
                📦 СКЛАД
            </button>

            <button class="menu-btn">
                👤 CRM
            </button>

            <button class="menu-btn">
                📊 АНАЛИТИКА
            </button>

        </div>

    </aside>

    <main class="main">

        <header class="topbar">

            <div class="stats">

                <div class="stat-card">
                    <span>💰 ОБЩАЯ ВЫРУЧКА</span>
                    <strong id="total-revenue">0 ₸</strong>
                </div>

                <div class="stat-card">
                    <span>🎱 АКТИВНЫЕ СТОЛЫ</span>
                    <strong id="active-tables">0</strong>
                </div>

                <div class="stat-card">
                    <span>⚠ ДОЛГИ</span>
                    <strong id="total-debts">0 ₸</strong>
                </div>

            </div>

            <button class="shift-btn">
                ⛔ ЗАКРЫТЬ СМЕНУ
            </button>

        </header>

        <section id="tables-container">

        </section>

    </main>

    <aside class="live-sidebar">

        <h2>⚡ LIVE CENTER</h2>

        <div id="live-center">

        </div>

    </aside>

</div>

<div id="toast" class="toast"></div>

<script type="module" src="./js/app.js"></script>

</body>
</html>
