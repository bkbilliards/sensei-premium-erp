<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENSEI ERP X | Enterprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div id="toast-container" class="toast-container no-print"></div>

    <div id="authScreen" class="auth-screen active no-print">
        <div class="glass-card auth-card">
            <div class="logo-circle pulse-gold">S</div>
            <h1 class="brand-title gold-gradient">SENSEI</h1>
            <p class="tagline">ERP ENTERPRISE X</p>
            <div class="input-group">
                <label>СМЕНА / АВТОРИЗАЦИЯ</label>
                <select id="staffSelect" class="cyber-input"><option>Загрузка персонала...</option></select>
            </div>
            <div class="input-group">
                <label>PIN-КОД</label>
                <input type="password" id="pinInput" class="cyber-input text-center text-24" placeholder="••••" inputmode="numeric" style="letter-spacing:15px;">
            </div>
            <button type="button" id="btn-login" class="btn-primary big-btn mt-10">ВХОД В СИСТЕМУ</button>
        </div>
    </div>

    <div id="appScreen" class="hidden no-print">
        <header class="topbar glass-panel">
            <div class="container topbar-container">
                <div class="brand-zone">
                    <div class="brand gold-gradient">SENSEI</div>
                    <div class="role-badge" id="userName">---</div>
                    <div id="syncStatus" class="success-text bold text-12 ml-10">ONLINE</div>
                </div>
                <div class="action-zone">
                    <button class="btn-ghost btn-sm" id="btn-logout">🚪 ВЫХОД / Z-ОТЧЕТ</button>
                </div>
            </div>
        </header>

        <nav class="cyber-nav hide-mobile">
            <div class="container nav-container">
                <button class="nav-btn active" data-tab="hall">🎱 ЗАЛ</button>
                <button class="nav-btn" data-tab="checks">🧾 ЧЕКИ</button>
                <button class="nav-btn" data-tab="bar">🍹 БАР</button>
                <button class="nav-btn" data-tab="crm">👥 CRM</button>
                <button class="nav-btn" data-tab="debts">📓 ДОЛГИ</button>
                <button class="nav-btn" data-tab="stock">📦 СКЛАД</button>
                <button class="nav-btn owner-only success-text" data-tab="acc" style="border-color:var(--success);">📈 БУХГАЛТЕРИЯ</button>
                <button class="nav-btn owner-only gold-text" data-tab="owner" style="border-color:var(--gold);">👑 ХОЗЯИН</button>
            </div>
        </nav>

        <main class="main-workspace container">
            <div id="tab-hall" class="tab-pane active">
                <div class="flex-between mb-20">
                    <h2 class="gold-text">ИГРОВЫЕ СТОЛЫ</h2>
                    <div id="live-clock" class="muted-text bold">--:--:--</div>
                </div>
                <div id="tablesGrid" class="map-view-container"></div>
            </div>
            <div id="tab-checks" class="tab-pane hidden"><h2 class="gold-text">АКТИВНЫЕ ЧЕКИ</h2><div id="checksGrid" class="checks-grid"></div></div>
            <div id="tab-bar" class="tab-pane hidden"><h2 class="gold-text text-center mt-40">БАР (В РАЗРАБОТКЕ)</h2></div>
            <div id="tab-crm" class="tab-pane hidden"><h2 class="gold-text text-center mt-40">CRM (В РАЗРАБОТКЕ)</h2></div>
            <div id="tab-debts" class="tab-pane hidden"><h2 class="gold-text text-center mt-40">ДОЛГИ (В РАЗРАБОТКЕ)</h2></div>
            <div id="tab-stock" class="tab-pane hidden"><h2 class="gold-text text-center mt-40">СКЛАД (В РАЗРАБОТКЕ)</h2></div>
            <div id="tab-acc" class="tab-pane hidden"><h2 class="gold-text text-center mt-40">БУХГАЛТЕРИЯ (ТОЛЬКО ХОЗЯИН)</h2></div>
            <div id="tab-owner" class="tab-pane hidden"><h2 class="gold-text text-center mt-40">ПАНЕЛЬ ХОЗЯИНА</h2></div>
        </main>

        <div class="mobile-nav">
            <button class="mobile-nav-item active" data-tab="hall"><div class="icon">🎱</div>ЗАЛ</button>
            <button class="mobile-nav-item" data-tab="checks"><div class="icon">🧾</div>ЧЕКИ</button>
            <button class="mobile-nav-item" data-tab="bar"><div class="icon">🍹</div>БАР</button>
            <button class="mobile-nav-item" data-tab="cash"><div class="icon">💵</div>КАССА</button>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
